[project]
name = "wacli-mcp"
version = "0.1.0"
description = "Read-only MCP server over a local wacli (WhatsApp CLI) store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.scripts]
wacli-mcp = "wacli_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wacli_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs the real wacli binary against a throwaway store inside an empty network namespace",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S108", "S311"]
